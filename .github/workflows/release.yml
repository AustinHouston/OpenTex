# Builds the downloads when you push a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# and publishes them as a GitHub Release. File names never change, so these links always
# point at the newest version:
#   https://github.com/AustinHouston/OpenTex/releases/latest/download/OpenTex-mac.dmg
#   https://github.com/AustinHouston/OpenTex/releases/latest/download/OpenTex-windows-setup.exe
#
# Optional code signing (removes the "unidentified developer" / SmartScreen warnings). Add these
# repository secrets and they are used automatically; without them the apps are built unsigned.
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID .p12), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds the files as workflow artifacts without publishing

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: |
              dist/OpenTex-mac.dmg
              dist/OpenTex-mac.zip
          - os: windows-latest
            target: --win
            files: |
              dist/OpenTex-windows-setup.exe
              dist/OpenTex-windows-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          ## Download

          | | |
          | --- | --- |
          | **Mac** (Apple Silicon and Intel) | [OpenTex-mac.dmg](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-mac.dmg) |
          | **Windows**, installs just for you, no admin needed | [OpenTex-windows-setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-windows-setup.exe) |
          | **Windows**, no install: unzip and run | [OpenTex-windows-portable.zip](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-windows-portable.zip) |

          First time opening it? See [Installing](https://github.com/${{ github.repository }}#installing) for the one-time security prompt.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "OpenTex $TAG" --notes-file notes.md --latest
          fi
