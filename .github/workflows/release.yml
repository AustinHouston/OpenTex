# Builds the downloads when you push a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# and publishes them as a GitHub Release. File names never change, so these links always
# point at the newest version:
#   https://github.com/AustinHouston/OpenTex/releases/latest/download/OpenTex-mac-apple-silicon.dmg
#   https://github.com/AustinHouston/OpenTex/releases/latest/download/OpenTex-mac-intel.dmg
#   https://github.com/AustinHouston/OpenTex/releases/latest/download/OpenTex-windows-setup.exe
#
# Optional code signing (removes the "unidentified developer" / SmartScreen warnings). Add these
# repository secrets and they are used automatically; without them the apps are built unsigned.
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID .p12), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds the files as workflow artifacts without publishing

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: |
              dist/OpenTex-mac-apple-silicon.dmg
              dist/OpenTex-mac-apple-silicon.zip
              dist/OpenTex-mac-intel.dmg
              dist/OpenTex-mac-intel.zip
          - os: windows-latest
            target: --win
            files: |
              dist/OpenTex-windows-setup.exe
              dist/OpenTex-windows-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build
      - name: Build the downloads
        shell: bash
        # Signing variables are only set when the secrets exist: electron-builder treats an empty
        # CSC_LINK as a file path and fails.
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          S_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$S_CSC_LINK" ]; then
            export CSC_LINK="$S_CSC_LINK" CSC_KEY_PASSWORD="$S_CSC_KEY_PASSWORD"
          fi
          if [ -n "$S_APPLE_ID" ]; then
            export APPLE_ID="$S_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$S_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
          fi
          if [ -n "$S_WIN_CSC_LINK" ]; then
            export WIN_CSC_LINK="$S_WIN_CSC_LINK" WIN_CSC_KEY_PASSWORD="$S_WIN_CSC_KEY_PASSWORD"
          fi
          npx electron-builder ${{ matrix.target }} --publish never
          # One Mac file per chip (half the size of a universal one), named so people can tell them apart.
          if [ "$RUNNER_OS" = "macOS" ]; then
            for ext in dmg zip; do
              mv "dist/OpenTex-mac-arm64.$ext" "dist/OpenTex-mac-apple-silicon.$ext"
              mv "dist/OpenTex-mac-x64.$ext" "dist/OpenTex-mac-intel.$ext"
            done
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          ## Download

          | | |
          | --- | --- |
          | **Mac** with Apple silicon (M1 or newer; every Mac sold since 2023) | [OpenTex-mac-apple-silicon.dmg](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-mac-apple-silicon.dmg) |
          | **Mac** with an Intel processor | [OpenTex-mac-intel.dmg](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-mac-intel.dmg) |
          | **Windows**, installs just for you, no admin needed | [OpenTex-windows-setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-windows-setup.exe) |
          | **Windows**, no install: unzip and run | [OpenTex-windows-portable.zip](https://github.com/${{ github.repository }}/releases/latest/download/OpenTex-windows-portable.zip) |

          Not sure which Mac you have? Apple menu → **About This Mac**: "Chip: Apple M…" is Apple silicon, "Processor: … Intel" is Intel.
          First time opening it? See [Installing](https://github.com/${{ github.repository }}#installing) for the one-time security prompt.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "OpenTex $TAG" --notes-file notes.md --latest
          fi
