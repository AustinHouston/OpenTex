<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Readability</title>
    <style>
      :root { --bg: #fff; --panel: #f4f4f2; --panelAlt: #e8e8e4; --border: #dcdcd6; --text: #24292f; --muted: #6e7781; --accent: #2f6feb; --accentText: #fff;
        --simple: #3b82f6; --dense: #f59e0b; --passive: #8b5cf6; --hedge: #14b8a6; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      body { padding: 10px 12px 16px; }
      h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
      button { cursor: pointer; }
      button:hover { background: var(--panelAlt); }
      .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .grow { flex: 1; }
      .empty { color: var(--muted); padding: 20px 4px; text-align: center; }
      .verdict { margin: 8px 0 2px; font-size: 13px; }
      .verdict b { font-weight: 600; }
      /* Register meter */
      .meter { position: relative; height: 10px; border-radius: 5px; margin: 6px 0 2px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--simple) 55%, var(--bg)), var(--panelAlt) 38%, var(--panelAlt) 62%, color-mix(in srgb, var(--dense) 60%, var(--bg))); }
      .meter i { position: absolute; top: -3px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 1.5px var(--bg); }
      .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; }
      /* Gauges */
      .gauge { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 6px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; }
      .gauge:hover { background: var(--panel); }
      .gauge[aria-pressed='true'] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .gauge .name { font-weight: 500; }
      .gauge .val { font-variant-numeric: tabular-nums; text-align: right; }
      .delta { font-size: 10.5px; margin-left: 4px; color: var(--muted); }
      .track { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--panelAlt); margin-top: 3px; }
      .band { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); }
      .dot { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--bg); background: var(--muted); }
      .dot.simple { background: var(--simple); } .dot.dense { background: var(--dense); } .dot.ok { background: var(--text); }
      .hint { grid-column: 1 / -1; color: var(--muted); font-size: 10.5px; }
      /* Document map */
      .map { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--panel); cursor: pointer; }
      .map span { flex: 1 1 0; min-width: 1px; }
      .map span:hover { outline: 1px solid var(--text); outline-offset: -1px; }
      /* Sections */
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      td, th { padding: 3px 4px; text-align: right; white-space: nowrap; }
      th { font-weight: 500; color: var(--muted); font-size: 10.5px; }
      td:first-child, th:first-child { text-align: left; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
      tr.sec { cursor: pointer; } tr.sec:hover td { background: var(--panel); }
      .cell-simple { color: var(--simple); font-weight: 600; } .cell-dense { color: var(--dense); font-weight: 600; }
      /* Flags and worst sentences */
      .flags label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
      .sw { display: inline-block; width: 18px; height: 0; border-bottom: 2px solid; }
      .sw.passive { border-bottom-style: dotted; border-color: var(--passive); }
      .sw.hedge { border-bottom-style: solid; border-color: var(--hedge); }
      .sw.filler { border-bottom-style: dashed; border-color: var(--muted); }
      .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      ol { margin: 0; padding-left: 18px; }
      li { padding: 4px 4px; margin-left: -4px; border-radius: 5px; cursor: pointer; }
      li:hover { background: var(--panel); }
      li .why { color: var(--muted); font-size: 10.5px; }
      li .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .legend { display: flex; gap: 10px; color: var(--muted); font-size: 10.5px; margin-top: 4px; }
      .legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
      .legend .s::before { background: color-mix(in srgb, var(--simple) 45%, var(--bg)); }
      .legend .d::before { background: color-mix(in srgb, var(--dense) 50%, var(--bg)); }
      .note { color: var(--muted); font-size: 10.5px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="preset">Target</label>
      <select id="preset" class="grow"></select>
    </div>
    <div id="out"><div class="empty">Open a .tex file to analyze it.</div></div>
    <script src="opentex-sdk.js"></script>
    <script src="analyze.js"></script>
    <script src="readability.js"></script>
  </body>
</html>
